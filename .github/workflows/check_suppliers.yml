name: 仕入先サイト更新チェック

on:
  schedule:
    - cron: '0 23 * * *'  # 毎朝8:00 JST (UTC 23:00)
  workflow_dispatch:       # 手動実行ボタン

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 仕入先サイトをチェック
        run: python check_suppliers.py
