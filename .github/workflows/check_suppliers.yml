name: 仕入先・マルシェ候補チェック

on:
  schedule:
    - cron: '0 23 * * *'    # 毎朝8:00 JST → 仕入先サイト更新チェック＋マルシェ候補チェック
  workflow_dispatch:         # 手動実行ボタン（アプリから都道府県を渡せる）
    inputs:
      prefectures:
        description: '都道府県コード（例: kanagawa,tokyo）'
        required: false
        default: 'kanagawa'
      job:
        description: '実行ジョブ (all/namamame/marche/suppliers)'
        required: false
        default: 'all'

jobs:
  check-suppliers:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 仕入先サイトをチェック
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: python check_suppliers.py

  check-marche:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event.inputs.job == 'all' || github.event.inputs.job == 'marche'
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: マルシェ候補をチェック
        env:
          PREFECTURES: ${{ github.event.inputs.prefectures || vars.PREFECTURES || 'kanagawa' }}
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: python check_marche.py

  check-namamame:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && (github.event.inputs.job == 'all' || github.event.inputs.job == 'namamame')
    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Python 3.11 をセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 生豆本舗 在庫チェック
        env:
          FIREBASE_DB_SECRET: ${{ secrets.FIREBASE_DB_SECRET }}
        run: python check_namamame.py

